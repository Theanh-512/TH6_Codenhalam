<section class="content-section">
  <div class="section-title">
    <h2>Danh sách sản phẩm</h2>
    <div class="view-options">
      <button class="btn-icon active"><i class="fas fa-th-large"></i></button>
    </div>
  </div>

  <div class="cards-grid" *ngIf="filteredProducts$ | async as products">
    <app-product-card 
      *ngFor="let product of products" 
      [product]="product">
    </app-product-card>

    <!-- Empty State -->
    <div *ngIf="products.length === 0" class="empty-placeholder">
      <i class="fas fa-box-open"></i>
      <p>Không tìm thấy sản phẩm nào khớp hoặc danh sách trống!</p>
    </div>
  </div>
</section>
